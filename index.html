<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --navy-dark:#071a3a; --navy:#0d2d5e; --navy-mid:#0f3570;
  --orange:#F57C00; --orange-light:#ffab40; --green:#27AE60;
  --white:#ffffff; --white-80:rgba(255,255,255,0.80);
  --white-40:rgba(255,255,255,0.40); --white-12:rgba(255,255,255,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
.item h3{overflow-wrap:anywhere}
html{scrollbar-color:var(--orange) var(--navy-dark)}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--navy-dark)}
::-webkit-scrollbar-thumb{background:var(--orange);border-radius:6px}
body{font-family:'Barlow',sans-serif;font-weight:400;line-height:1.6;color:var(--white-80);background:var(--navy-dark);min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
  background-size:40px 40px}
.circle{position:fixed;border-radius:50%;border:1px solid rgba(255,255,255,0.05);pointer-events:none;z-index:0}
.c1{width:620px;height:620px;top:-220px;right:-180px;background:rgba(15,53,112,0.12)}
.c2{width:380px;height:380px;bottom:-140px;left:-120px;border-color:rgba(245,124,0,0.10)}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 24px}
.display{font-family:'Barlow Condensed',sans-serif;font-weight:900;text-transform:uppercase;color:var(--white);line-height:1}

header{padding:28px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:1.6rem;white-space:nowrap}
.logo .br{color:var(--orange);font-family:'Barlow',sans-serif;font-weight:400}
.logo .ang{color:rgba(255,255,255,0.45);font-family:'Barlow',sans-serif;font-weight:300}
.logo .n1{font-family:'Barlow',sans-serif;font-weight:400;color:var(--white-80)}
.logo .n2{font-family:'Barlow Condensed',sans-serif;font-weight:900;color:#fff}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;background:rgba(39,174,96,0.12);border:1px solid rgba(39,174,96,0.4);color:var(--green);font-size:.85rem}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,174,96,.7)}70%{box-shadow:0 0 0 9px rgba(39,174,96,0)}100%{box-shadow:0 0 0 0 rgba(39,174,96,0)}}

.hero{padding:36px 0 24px;max-width:720px}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);margin-bottom:14px}
.hero h1 .code{color:var(--orange)}
.hero p{font-weight:300;font-size:1.1rem;max-width:520px}

.search{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.field{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:rgba(7,20,50,0.8);border:1px solid var(--white-12);border-radius:4px;padding:0 16px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,124,0,.18)}
.field span{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--orange);font-size:1.4rem}
.field input{flex:1;background:none;border:0;outline:0;color:#fff;font:400 1.1rem 'Barlow',sans-serif;padding:16px 0;letter-spacing:.04em}
.field input::placeholder{color:var(--white-40)}
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;cursor:pointer;padding:0 28px;min-height:54px;border:1px solid transparent;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,color .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--orange-light);transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,124,0,.45)}
.btn-ghost{background:transparent;color:var(--white-80);border-color:rgba(255,255,255,.3)}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.item:focus-visible{outline:2px solid var(--orange-light);outline-offset:3px}

/* barra de seleção */
.bar{position:sticky;top:0;z-index:5;margin:28px 0 20px;padding:14px 18px;border-radius:12px;
  background:rgba(7,20,50,0.92);backdrop-filter:blur(8px);border:1px solid var(--white-12);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0;background:linear-gradient(90deg,var(--orange),var(--orange-light),transparent)}
.bar .info{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .count{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.3rem;color:#fff}
.bar .count b{color:var(--orange)}
.bar .btn{min-height:44px;font-size:1.05rem;padding:0 20px}
.bar .acts{display:flex;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--white-80);font:400 .95rem 'Barlow',sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--orange)}

/* grade do catálogo */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-bottom:70px}
.item{position:relative;background:rgba(7,20,50,0.80);border:1px solid var(--white-12);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.item::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:2;background:linear-gradient(90deg,var(--orange),var(--orange-light),transparent)}
.item:hover{border-color:rgba(245,124,0,.5)}
.item.sel{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange),0 8px 28px rgba(245,124,0,.18)}
.item .pic{aspect-ratio:1/1;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center}
.item .pic img{width:100%;height:100%;object-fit:cover;display:block}
.item .body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:4px}
.item .tag{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--orange);letter-spacing:.04em;font-size:0.95rem}
.item h3{font-size:1.45rem}
.item .price{font-family:'Barlow Condensed',sans-serif;font-weight:900;color:#fff;font-size:2rem;line-height:1.1;margin-top:4px}
.item .price small{font-size:1rem;color:var(--orange);margin-right:4px;font-weight:700}
.item .compat{font-size:.82rem;line-height:1.35;font-weight:300;color:var(--white-80);margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .compat b{font-weight:400;color:var(--orange-light)}
.chk{position:absolute;top:12px;left:12px;z-index:3;width:28px;height:28px}
.chk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.chk span{position:absolute;inset:0;border-radius:4px;background:rgba(7,26,58,.85);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.chk span::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.chk input:checked + span{background:var(--orange);border-color:var(--orange)}
.chk input:checked + span::after{opacity:1}
.chk input:focus-visible + span{outline:2px solid var(--orange-light);outline-offset:3px}

/* quantidade */
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:34px;height:34px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(7,20,50,.85);color:#fff;font:700 1.2rem 'Barlow Condensed',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;padding:0}
.qty button:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty input{width:52px;height:34px;text-align:center;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(7,20,50,.85);color:#fff;font:700 1rem 'Barlow Condensed',sans-serif}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty input[type=number]{-moz-appearance:textfield;appearance:textfield}
.qty input:focus{outline:none;border-color:var(--orange)}
.qty .sub{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--orange-light);font-size:1rem;white-space:nowrap;margin-left:auto}

.empty{grid-column:1/-1;padding:28px;border-radius:12px;background:rgba(7,20,50,0.8);border:1px dashed rgba(255,255,255,.2)}
.empty .display{font-size:1.6rem;margin-bottom:6px}
.empty .display b{color:var(--orange)}
footer{position:relative;z-index:1;border-top:1px solid var(--white-12);padding:24px 0;text-align:center;font-size:.9rem;color:var(--white-40)}

/* impressão / PDF */
#print{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff;color:#111}
  body::before,.circle,.wrap,footer{display:none!important}
  #print{display:block;font-family:'Barlow',Arial,sans-serif;color:#111}
  #print .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #F57C00;padding-bottom:10px;margin-bottom:16px}
  #print .ph .t{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:900;font-size:26pt;text-transform:uppercase;color:#071a3a;line-height:1}
  #print .ph .d{font-size:10pt;color:#555}
  #print .row{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid #ddd;break-inside:avoid}
  #print .row img{width:90px;height:90px;object-fit:cover;border-radius:6px;flex:none;border:1px solid #ddd}
  #print .row .n{flex:1}
  #print .row .c{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;color:#F57C00;font-size:11pt}
  #print .row .nm{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:900;font-size:16pt;text-transform:uppercase;color:#071a3a}
  #print .row .cp{font-size:9pt;color:#555;margin-top:2px;line-height:1.3}
  #print .row .qt{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;font-size:12pt;color:#071a3a;background:#f4f4f4;border:1px solid #ddd;border-radius:6px;padding:4px 10px;text-align:center;min-width:62px}
  #print .row .qt small{display:block;font-size:7pt;color:#777;text-transform:uppercase;letter-spacing:.04em}
  #print .row .p{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:900;font-size:18pt;color:#071a3a;min-width:110px;text-align:right}
  #print .tot{display:flex;justify-content:flex-end;gap:14px;align-items:baseline;margin-top:16px;font-family:'Barlow Condensed',Arial,sans-serif}
  #print .tot span{font-size:12pt;text-transform:uppercase;color:#555}
  #print .tot b{font-size:24pt;font-weight:900;color:#F57C00}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:720px){
  .wrap{padding:0 16px}
  .c1{width:380px;height:380px;top:-160px;right:-160px}
  .c2{width:240px;height:240px;bottom:-100px;left:-100px}
  header{padding:18px 0 6px}
  .logo{font-size:1.3rem}
  .badge{font-size:.78rem;padding:4px 10px}
  .hero{padding:20px 0 8px}
  .hero h1{font-size:2.6rem;margin-bottom:10px}
  .hero p{font-size:1rem}
  .search{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
  .field{grid-column:1/-1;flex:none}
  .field input{font-size:16px;padding:14px 0}
  .search .btn{min-height:50px;padding:0 12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:170px}
  .item .body{padding:10px 12px 14px}
  .item h3{font-size:1.15rem}
  .item .price{font-size:1.55rem}
  .chk{width:32px;height:32px;top:8px;left:8px}
  .qty{gap:4px;margin-top:6px}
  .qty button{width:30px;height:30px;font-size:1.1rem}
  .qty input{width:42px;height:30px;font-size:.95rem}
  .qty .sub{font-size:.85rem;margin-left:0;flex-basis:100%}
  .empty{padding:20px}
  /* barra de seleção fixa no rodapé, ao alcance do polegar */
  .bar{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;z-index:20;border-radius:14px 14px 0 0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;
    background:rgba(7,20,50,.96);box-shadow:0 -10px 30px rgba(0,0,0,.45)}
  .bar::before{border-radius:14px 14px 0 0}
  .bar .info{display:contents}
  .bar .count{grid-column:1;grid-row:1;font-size:1.25rem}
  .bar .acts{grid-column:2;grid-row:1;width:auto}
  .bar .acts .btn{min-height:46px;padding:0 22px;flex:none}
  #todos{grid-column:1;grid-row:2;justify-self:start}
  #nenhum{grid-column:2;grid-row:2;justify-self:end}
  .linkbtn{padding:6px 0;font-size:.9rem}
  footer{padding:20px 16px 130px;font-size:.8rem}
}
@media(max-width:360px){
  .hero h1{font-size:2.2rem}
  .logo{font-size:1.15rem}
  .badge{display:none}
  .grid{gap:10px}
}
@media(hover:none){.item:hover{border-color:var(--white-12)}.item.sel:hover{border-color:var(--orange)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="circle c1"></div><div class="circle c2"></div>

<div class="wrap">
  <header>
    <div class="logo" aria-label="Erlan Campos">
      <span class="br">[</span><span class="ang">&lt;</span>
      <span class="n1"> Erlan </span><span class="ang">/</span>
      <span class="n2"> Campos </span><span class="ang">&gt;</span><span class="br">]</span>
    </div>
    <span class="badge"><i></i> Catálogo online</span>
  </header>

  <section class="hero">
    <h1 class="display">Catálogo de <span class="code">itens</span></h1>
    <div class="search" role="search">
      <label class="field" for="codigo">
        <input id="codigo" type="text" autocomplete="off" placeholder="Digite o código">
      </label>
      <button class="btn btn-primary" id="buscar" type="button">Buscar</button>
      <button class="btn btn-ghost" id="limpar" type="button">Ver todos</button>
    </div>
  </section>

  <div class="bar" role="region" aria-label="Itens selecionados">
    <div class="info">
      <span class="count"><b id="qtd">0</b> selecionado(s) · <b id="qtdTotal">0</b> un.</span>
      <button class="linkbtn" id="todos" type="button">Selecionar todos os exibidos</button>
      <button class="linkbtn" id="nenhum" type="button">Desmarcar</button>
    </div>
    <div class="acts">
      <button class="btn btn-primary" id="pdf" type="button" disabled>Baixar PDF</button>
    </div>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>
</div>

<footer>Desenvolvido por <strong style="color:#fff">Erlan Campos</strong> · Desenvolvedor Web &amp; T.I Profissional</footer>

<div id="print"></div>

<script src="produtos-roland.js"></script>
<script>
/* ============================================================
   CONFIGURAÇÃO — edite aqui
   Cada item: code, nome, preco, imagem (caminho/URL)
   Fotos na pasta imagens/ ao lado deste arquivo.
   ============================================================ */
const MOEDA = "R$";
const TITULO_PDF = "Catálogo";
const MEUS_ITENS = [
  
];
/* ============================================================ */

/* Junta os seus itens com o catálogo Roland (arquivo produtos-roland.js) */
const ITENS = MEUS_ITENS.concat(typeof ITENS_ROLAND !== "undefined" ? ITENS_ROLAND : [])
  .map((i, n) => Object.assign({ code: "", compat: "" }, i, { id: String(n) }));

const $ = id => document.getElementById(id);
const grid = $("grid"), input = $("codigo");
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g,"");
const fmt = n => Number(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PH = "data:image/svg+xml;utf8," + encodeURIComponent(
 `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><rect width='400' height='400' fill='#0d2d5e'/><text x='200' y='205' font-family='sans-serif' font-size='20' fill='rgba(255,255,255,.5)' text-anchor='middle'>Sem imagem</text></svg>`);
const IMG_ERR = `onerror="this.onerror=null;this.src='${PH}'"`;

/* selecionados: Map id -> quantidade (item só entra no Map quando qtd >= 1) */
const selecionados = new Map();
let exibidos = ITENS.slice();

const qtdDe = id => selecionados.get(id) || 0;

function atualizaBarra(){
  let un = 0;
  selecionados.forEach(q => un += q);
  $("qtd").textContent = selecionados.size;
  $("qtdTotal").textContent = un;
  $("pdf").disabled = selecionados.size === 0;
}

function render(){
  if(!exibidos.length){
    grid.innerHTML = `<div class="empty"><div class="display">Nenhum código <b>encontrado</b></div><p>Confira o código digitado ou clique em "Ver todos".</p></div>`;
    return;
  }
  grid.innerHTML = exibidos.map(i => {
    const q = qtdDe(i.id);
    const sel = q > 0;
    return `
    <article class="item ${sel?'sel':''}" data-code="${i.id}">
      <label class="chk" title="Selecionar item">
        <input type="checkbox" ${sel?'checked':''} aria-label="Selecionar ${esc(i.nome)}">
        <span></span>
      </label>
      <div class="pic"><img src="${esc(i.imagem)}" alt="${esc(i.nome)}" loading="lazy" ${IMG_ERR}></div>
      <div class="body">
        <div class="tag">${i.code ? esc(i.code) : "Sob consulta"}</div>
        <h3 class="display">${esc(i.nome)}</h3>
        ${i.compat ? `<p class="compat" title="${esc(i.compat)}"><b>Compatível:</b> ${esc(i.compat)}</p>` : ""}
        <div class="price"><small>${MOEDA}</small>${fmt(i.preco)}</div>
        <div class="qty">
          <button type="button" data-act="menos" aria-label="Diminuir quantidade" ${q<=0?'disabled':''}>−</button>
          <input type="number" min="0" max="999" step="1" value="${q}" inputmode="numeric" aria-label="Quantidade de ${esc(i.nome)}">
          <button type="button" data-act="mais" aria-label="Aumentar quantidade">+</button>
          ${q>0 ? `<span class="sub">${MOEDA} ${fmt(Number(i.preco)*q)}</span>` : ``}
        </div>
      </div>
    </article>`;
  }).join("");
}

/* aplica quantidade e sincroniza card + barra */
function setQtd(id, q){
  q = Math.max(0, Math.min(999, Math.floor(Number(q) || 0)));
  q > 0 ? selecionados.set(id, q) : selecionados.delete(id);
  const el = grid.querySelector(`[data-code="${CSS.escape(id)}"]`);
  if(el){
    const on = q > 0;
    el.classList.toggle("sel", on);
    el.querySelector(".chk input").checked = on;
    el.querySelector(".qty input").value = q;
    el.querySelector('[data-act="menos"]').disabled = !on;
    const item = ITENS.find(i => i.id === id);
    let sub = el.querySelector(".qty .sub");
    if(on && item){
      if(!sub){ sub = document.createElement("span"); sub.className = "sub"; el.querySelector(".qty").appendChild(sub); }
      sub.textContent = `${MOEDA} ${fmt(Number(item.preco)*q)}`;
    } else if(sub){ sub.remove(); }
  }
  atualizaBarra();
}

/* clique no card / checkbox / botões de quantidade */
grid.addEventListener("click", e => {
  const card = e.target.closest(".item"); if(!card) return;
  const id = card.dataset.code;

  const qbtn = e.target.closest("[data-act]");
  if(qbtn){
    e.stopPropagation();
    const cur = qtdDe(id);
    setQtd(id, qbtn.dataset.act === "mais" ? cur + 1 : cur - 1);
    return;
  }

  const box = card.querySelector(".chk input");
  if(e.target === box){
    box.checked ? selecionados.set(id, qtdDe(id) || 1) : selecionados.delete(id);
    setQtd(id, box.checked ? (qtdDe(id) || 1) : 0);
    return;
  }
  if(e.target.closest(".chk")) return;          // label do checkbox cuida sozinho
  if(e.target.closest(".qty")) return;          // digitar no input não alterna

  setQtd(id, qtdDe(id) > 0 ? 0 : 1);            // clique no card alterna
});

/* digitar quantidade direto no input */
grid.addEventListener("input", e => {
  const qi = e.target.closest(".qty input"); if(!qi) return;
  const card = qi.closest(".item");
  const v = qi.value.replace(/\D/g, "");
  qi.value = v;
  const id = card.dataset.code;
  v === "" ? selecionados.delete(id) : setQtd(id, Number(v));
  atualizaBarra();
});
grid.addEventListener("change", e => {
  const qi = e.target.closest(".qty input"); if(!qi) return;
  if(qi.value === "" || Number(qi.value) === 0) setQtd(qi.closest(".item").dataset.code, 0);
});

function buscar(){
  const q = norm(input.value);
  exibidos = q ? ITENS.filter(i => [i.code, i.nome, i.compat].some(t => norm(t || "").includes(q))) : ITENS.slice();
  render();
}
function verTodos(){ input.value=""; exibidos = ITENS.slice(); render(); }

$("buscar").addEventListener("click", buscar);
$("limpar").addEventListener("click", verTodos);
input.addEventListener("keydown", e => { if(e.key==="Enter") buscar(); });
$("todos").addEventListener("click", () => { exibidos.forEach(i => { if(!selecionados.has(i.id)) selecionados.set(i.id, 1); }); render(); atualizaBarra(); });
$("nenhum").addEventListener("click", () => { selecionados.clear(); render(); atualizaBarra(); });

/* PDF: monta a folha só com os itens marcados e abre "Salvar como PDF" */
$("pdf").addEventListener("click", () => {
  const lista = ITENS.filter(i => selecionados.has(i.id))
    .map(i => ({ item: i, qtd: selecionados.get(i.id), sub: Number(i.preco) * selecionados.get(i.id) }));
  if(!lista.length) return;
  const total = lista.reduce((s, x) => s + x.sub, 0);
  const unidades = lista.reduce((s, x) => s + x.qtd, 0);
  const data = new Date().toLocaleDateString("pt-BR");
  $("print").innerHTML = `
    <div class="ph"><div class="t">${esc(TITULO_PDF)}</div><div class="d">${data} · ${lista.length} item(ns) · ${unidades} unidade(s)</div></div>
    ${lista.map(({item:i, qtd, sub}) => `
      <div class="row">
        <img src="${esc(i.imagem)}" alt="" ${IMG_ERR}>
        <div class="n">
          <div class="c">Código: ${i.code ? esc(i.code) : "Sob consulta"}</div>
          <div class="nm">${esc(i.nome)}</div>
          ${i.compat ? `<div class="cp">Compatível: ${esc(i.compat)}</div>` : ""}
          <div class="cp">Unitário: ${MOEDA} ${fmt(i.preco)}</div>
        </div>
        <div class="qt"><small>Qtd.</small>${qtd}</div>
        <div class="p">${MOEDA}${fmt(sub)}</div>
      </div>`).join("")}
    <div class="tot"><span>Total (${unidades} un.)</span><b>${MOEDA} ${fmt(total)}</b></div>`;
  const imgs = [...$("print").querySelectorAll("img")];
  Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })))
    .then(() => window.print());
});

render(); atualizaBarra();
</script>

<!-- COLE O CÓDIGO DE PROTEÇÃO AQUI -->
<script>
  // Bloqueia o clique com o botão direito (menu de contexto)
  document.addEventListener('contextmenu', event => event.preventDefault());

  // Impede que as imagens sejam arrastadas com o rato
  document.addEventListener('dragstart', event => {
    if (event.target.tagName.toLowerCase() === 'img') {
      event.preventDefault();
    }
  });

  // Tenta bloquear atalhos do teclado (F12, Ctrl+Shift+I, Ctrl+U)
  document.addEventListener('keydown', event => {
    if (event.key === 'F12' || 
       (event.ctrlKey && event.shiftKey && event.key === 'I') || 
       (event.ctrlKey && event.key === 'U')) {
      event.preventDefault();
    }
  });
</script>
